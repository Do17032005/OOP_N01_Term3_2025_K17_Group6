<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>In vé xem phim</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .ticket {
            max-width: 400px;
            margin: 40px auto;
            padding: 32px 28px 24px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 2px solid #0d6efd;
            background: #fff;
        }
        .ticket-title {
            text-align: center;
            color: #0d6efd;
            font-weight: 700;
            margin-bottom: 18px;
        }
        .ticket-info {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .ticket-footer {
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>
<body>
<div class="ticket">
    <h2 class="ticket-title">VÉ XEM PHIM</h2>
    <div class="ticket-info"><b>Mã vé:</b> <span th:text="${ticket.id}"></span></div>
    <div class="ticket-info"><b>Mã suất chiếu:</b> <span th:text="${ticket.showtimeId}"></span></div>
    <div class="ticket-info"><b>Mã ghế:</b> <span th:text="${ticket.seatId}"></span></div>
    <div class="ticket-info"><b>Mã khách hàng:</b> <span th:text="${ticket.customerId}"></span></div>
    <div class="ticket-info"><b>Giá vé:</b> <span th:text="${ticket.price}"></span> VND</div>
    <div class="ticket-footer">
        <button class="btn btn-primary" onclick="window.print()">In vé</button>
        <a href="/" class="btn btn-secondary">Trang chủ</a>
    </div>
</div>
</body>
</html>
