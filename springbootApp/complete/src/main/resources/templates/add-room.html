<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Room</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Add Room</h1>
    <form th:action="@{/rooms/add}" th:object="${room}" method="post" class="mb-3">
        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" th:field="*{name}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Total Seats:</label>
            <input type="number" th:field="*{totalSeats}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success">Add</button>
        <a href="/rooms" class="btn btn-secondary">Back to Room List</a>
    </form>
</div>
</body>
</html>
