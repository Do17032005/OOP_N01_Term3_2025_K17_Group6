<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Seat List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Seat List</h1>
    <a href="/seats/add" class="btn btn-primary mb-3">Add Seat</a>
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Room ID</th>
            <th>Seat Number</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="seat : ${seats}">
            <td th:text="${seat.id}"></td>
            <td th:text="${seat.roomId}"></td>
            <td th:text="${seat.seatNumber}"></td>
            <td>
                <a th:href="@{'/seats/edit/' + ${seat.id}}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{'/seats/delete/' + ${seat.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this seat?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
