<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chọn phim</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h1 class="mb-4">Chọn phim</h1>
    <div th:if="${loggedInCustomer == null}" class="alert alert-warning text-center mt-3">
        Vui lòng <a href="/login">đăng nhập</a> để đặt vé.
    </div>
    <div th:if="${loggedInCustomer != null}">
        <table class="table table-bordered table-hover">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Title</th>
                <th>Show Time</th>
                <th>Date Time</th>
                <th>Duration</th>
                <th>Genre</th>
                <th>Age</th>
                <th>Chọn</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${movies}">
                <td th:text="${movie.id}"></td>
                <td th:text="${movie.name}"></td>
                <td th:text="${movie.title}"></td>
                <td th:text="${movie.showTime}"></td>
                <td th:text="${movie.dateTime}"></td>
                <td th:text="${movie.duration}"></td>
                <td th:text="${movie.genre}"></td>
                <td th:text="${movie.age}"></td>
                <td>
                    <a th:href="@{'/booking/showtimes?movieId=' + ${movie.id}}" class="btn btn-primary btn-sm">Chọn</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
