<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chọn ghế</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Chọn ghế</h1>
    <div class="row">
        <div class="col-md-12">
            <div class="d-flex flex-wrap">
                <div th:each="seat : ${seats}" class="m-2">
                    <a th:href="@{'/booking/customer?showtimeId=' + ${showtimeId} + '&seatId=' + ${seat.id}}" class="btn btn-outline-success">
                        <span th:text="${seat.seatNumber}"></span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <a th:href="@{'/booking/showtimes?movieId=' + ${seats[0]?.roomId}}" class="btn btn-secondary mt-3">Quay lại chọn suất chiếu</a>
</div>
</body>
</html>
