<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error - Cinema Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .error-header {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            padding: 40px 30px;
        }
        .error-body {
            padding: 40px;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .btn-home {
            background: linear-gradient(135deg, #0d6efd, #0056b3);
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn-home:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            color: white;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-header">
            <i class="bi bi-exclamation-triangle error-icon"></i>
            <h2 class="mb-2">Oops! Something went wrong</h2>
            <p class="mb-0" th:text="${status} + ' - ' + ${error}">404 - Page Not Found</p>
        </div>
        <div class="error-body">
            <p class="text-muted mb-4" th:text="${message ?: 'The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.'}">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            <a href="/" class="btn-home">
                <i class="bi bi-house"></i> Go to Homepage
            </a>
        </div>
    </div>
</body>
</html>
