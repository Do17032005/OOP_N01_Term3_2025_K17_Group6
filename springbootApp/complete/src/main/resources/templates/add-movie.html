<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm phim mới</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #f8fafc; }
        .main-title { color: #0d6efd; font-weight: 700; margin-bottom: 32px; text-align: center; }
        .card { max-width: 600px; margin: 40px auto; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
        .btn-main { background: #0d6efd; color: #fff; font-weight: 600; border-radius: 8px; padding: 12px 32px; font-size: 1.1rem; }
        .btn-main:hover { background: #0b5ed7; color: #fff; }
    </style>
</head>
<body>
<div th:replace="fragments/navbar.html :: nav"></div>
<div class="container py-5">
    <div class="card p-4">
        <h2 class="main-title"><i class="bi bi-plus-circle"></i> Thêm phim mới</h2>
        <form th:action="@{/movies/add}" th:object="${movie}" method="post">
            <div class="mb-3">
                <label for="id" class="form-label">ID phim (có thể để trống để tự sinh)</label>
                <input type="text" class="form-control" id="id" th:field="*{id}">
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Tên phim</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
            </div>
            <div class="mb-3">
                <label for="title" class="form-label">Tên phim (title)</label>
                <input type="text" class="form-control" id="title" th:field="*{title}" required>
            </div>
            <div class="mb-3">
                <label for="showTime" class="form-label">Ngày phát hành (showTime)</label>
                <input type="text" class="form-control" id="showTime" th:field="*{showTime}" required>
            </div>
            <div class="mb-3">
                <label for="dateTime" class="form-label">Ngày giờ chiếu (dateTime)</label>
                <input type="text" class="form-control" id="dateTime" th:field="*{dateTime}" required>
            </div>
            <div class="mb-3">
                <label for="duration" class="form-label">Thời lượng (phút)</label>
                <input type="number" class="form-control" id="duration" th:field="*{duration}" min="1" required>
            </div>
            <div class="mb-3">
                <label for="genre" class="form-label">Thể loại</label>
                <input type="text" class="form-control" id="genre" th:field="*{genre}" required>
            </div>
            <div class="mb-3">
                <label for="age" class="form-label">Độ tuổi (age)</label>
                <input type="number" class="form-control" id="age" th:field="*{age}" min="0" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Mô tả</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
            </div>
            <div class="d-flex justify-content-between">
                <a href="/movies" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Quay lại</a>
                <button type="submit" class="btn btn-main"><i class="bi bi-save"></i> Lưu phim</button>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
