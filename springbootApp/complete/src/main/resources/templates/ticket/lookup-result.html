<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kết quả tra cứu vé</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Kết quả tra cứu vé</h1>
    <div th:if="${ticket != null}">
        <ul class="list-group mb-3">
            <li class="list-group-item"><b>Mã vé:</b> <span th:text="${ticket.id}"></span></li>
            <li class="list-group-item"><b>Mã suất chiếu:</b> <span th:text="${ticket.showtimeId}"></span></li>
            <li class="list-group-item"><b>Mã ghế:</b> <span th:text="${ticket.seatId}"></span></li>
            <li class="list-group-item"><b>Mã khách hàng:</b> <span th:text="${ticket.customerId}"></span></li>
            <li class="list-group-item"><b>Giá vé:</b> <span th:text="${ticket.price}"></span> VND</li>
        </ul>
        <a th:href="@{'/tickets/print/' + ${ticket.id}}" class="btn btn-success">In vé</a>
    </div>
    <div th:if="${ticket == null}">
        <div class="alert alert-danger">Không tìm thấy vé với mã đã nhập.</div>
    </div>
    <a href="/tickets/lookup" class="btn btn-secondary">Tra cứu lại</a>
</div>
</body>
</html>
