<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Add Ticket</h1>
    <form th:action="@{/tickets/add}" th:object="${ticket}" method="post" class="mb-3">
        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Showtime ID:</label>
            <input type="text" th:field="*{showtimeId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Seat ID:</label>
            <input type="text" th:field="*{seatId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Customer ID:</label>
            <input type="text" th:field="*{customerId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Price:</label>
            <input type="number" th:field="*{price}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success">Add</button>
        <a href="/tickets" class="btn btn-secondary">Back to Ticket List</a>
    </form>
</div>
</body>
</html>
