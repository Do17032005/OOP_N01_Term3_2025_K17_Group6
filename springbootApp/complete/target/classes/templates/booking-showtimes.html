<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chọn suất chiếu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Chọn suất chiếu</h1>
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Room ID</th>
            <th>Start Time</th>
            <th>Chọn</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="showtime : ${showtimes}">
            <td th:text="${showtime.id}"></td>
            <td th:text="${showtime.roomId}"></td>
            <td th:text="${showtime.startTime}"></td>
            <td>
                <a th:href="@{'/booking/seats?showtimeId=' + ${showtime.id}}" class="btn btn-primary btn-sm">Chọn</a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{'/booking/movies'}" class="btn btn-secondary">Quay lại chọn phim</a>
</div>
</body>
</html>
