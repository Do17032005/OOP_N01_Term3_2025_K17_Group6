<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách phòng chiếu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #f8fafc; }
        .main-title { color: #0d6efd; font-weight: 700; margin-bottom: 32px; }
        .table thead { background: #0d6efd; color: #fff; }
        .table-hover tbody tr:hover { background: #e7f1ff; }
        .btn-add { background: #0d6efd; color: #fff; }
        .btn-add:hover { background: #0b5ed7; color: #fff; }
    </style>
</head>
<body>
<div th:replace="fragments/navbar.html :: nav"></div>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="main-title"><i class="bi bi-door-open"></i> Danh sách phòng chiếu</h1>
        <a href="/rooms/add" class="btn btn-add"><i class="bi bi-plus-circle"></i> Thêm phòng mới</a>
    </div>
    <div class="table-responsive rounded shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Tên phòng</th>
                    <th scope="col">Số ghế</th>
                    <th scope="col">Mô tả</th>
                    <th scope="col">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="room, iterStat : ${rooms}">
                    <th th:text="${iterStat.count}"></th>
                    <td th:text="${room.name}"></td>
                    <td th:text="${room.seatCount}"></td>
                    <td th:text="${room.description}"></td>
                    <td>
                        <a th:href="@{'/rooms/edit/' + ${room.id}}" class="btn btn-sm btn-warning me-1"><i class="bi bi-pencil-square"></i></a>
                        <a th:href="@{'/rooms/delete/' + ${room.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc muốn xóa phòng này?');"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rooms)}">
                    <td colspan="5" class="text-center text-muted">Chưa có phòng chiếu nào.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
