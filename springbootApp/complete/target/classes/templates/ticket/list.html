<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh sách vé</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #f8fafc; }
        .main-title { color: #0d6efd; font-weight: 700; margin-bottom: 32px; }
        .table thead { background: #0d6efd; color: #fff; }
        .table-hover tbody tr:hover { background: #e7f1ff; }
    </style>
</head>
<body>
<div class="container py-5">
    <h1 class="main-title"><i class="bi bi-receipt"></i> Danh sách vé đã bán</h1>
    <div class="table-responsive rounded shadow-sm">
        <table class="table table-hover align-middle mb-0">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Mã vé</th>
                    <th scope="col">Suất chiếu</th>
                    <th scope="col">Ghế</th>
                    <th scope="col">Khách hàng</th>
                    <th scope="col">Giá</th>
                    <th scope="col">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ticket, iterStat : ${tickets}">
                    <th th:text="${iterStat.count}"></th>
                    <td th:text="${ticket.id}"></td>
                    <td th:text="${ticket.showtimeId}"></td>
                    <td th:text="${ticket.seatId}"></td>
                    <td th:text="${ticket.customerId}"></td>
                    <td th:text="${#numbers.formatDecimal(ticket.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td>
                        <a th:href="@{'/tickets/print/' + ${ticket.id}}" class="btn btn-sm btn-success me-1"><i class="bi bi-printer"></i></a>
                        <a th:href="@{'/tickets/delete/' + ${ticket.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Bạn có chắc muốn xóa vé này?');"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tickets)}">
                    <td colspan="7" class="text-center text-muted">Chưa có vé nào.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
