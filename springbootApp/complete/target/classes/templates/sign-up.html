<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Đăng ký khách hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.23.5/dist/bootstrap-table.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.23.5/dist/bootstrap-table.min.js"></script>
    <style>
        :root {
            --main-primary: #0d6efd;
            --primary-bg-subtle: #dbeafe;
            --primary-border-subtle: #69a7fa;
            --primary-text-emphasis: #084298;
        }
        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
            background: var(--primary-bg-subtle);
            margin: 0;
            padding: 0;
        }
        .container {
            background: #fff;
            max-width: 400px;
            margin: 40px auto;
            padding: 32px 28px 24px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 2px solid var(--primary-border-subtle);
        }
        h2 {
            text-align: center;
            color: var(--main-primary);
            margin-bottom: 28px;
            font-weight: 700;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        form label {
            align-self: flex-start;
            margin-bottom: 6px;
            color: var(--primary-text-emphasis);
            font-weight: 600;
        }
        form input[type="text"],
        form input[type="email"] {
            width: 90%;
            padding: 8px 10px;
            margin-bottom: 16px;
            border: 1px solid var(--primary-border-subtle);
            border-radius: 5px;
            font-size: 15px;
            background: #fff;
            font-family: inherit;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        button[type="submit"] {
            width: 90%;
            padding: 10px;
            background: var(--main-primary);
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        button[type="submit"]:hover {
            background: #084298;
        }
        .message {
            text-align: center;
            color: var(--main-primary);
            margin-top: 12px;
            min-height: 20px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: var(--main-primary);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>Đăng ký khách hàng</h2>
        <form th:action="@{/register}" th:object="${customer}" method="post" class="mb-3">
            <div class="mb-3">
                <label class="form-label">Tên:</label>
                <input type="text" th:field="*{name}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label">Số điện thoại:</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-success">Đăng ký</button>
            <a th:href="@{/login}" class="btn btn-secondary mt-2">Quay lại đăng nhập</a>
        </form>
        <p class="message" th:text="${message}"></p>
    </div>
</body>
</html>
