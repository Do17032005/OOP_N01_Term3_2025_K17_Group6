<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập khách hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background: #f8fafc; }
        .login-card { max-width: 400px; margin: 60px auto; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); padding: 32px; background: #fff; }
        .main-title { color: #0d6efd; font-weight: 700; margin-bottom: 32px; text-align: center; }
        .btn-main { background: #0d6efd; color: #fff; width: 100%; }
        .btn-main:hover { background: #0b5ed7; color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card">
        <h2 class="main-title"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập khách hàng</h2>
        <form th:action="@{/login}" th:object="${loginForm}" method="post">
            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" th:field="*{email}" class="form-control" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Số điện thoại:</label>
                <input type="text" th:field="*{phoneNumber}" class="form-control" required />
            </div>
            <div class="d-grid mb-2">
                <button type="submit" class="btn btn-main">Đăng nhập</button>
            </div>
            <div th:if="${loginError}" class="alert alert-danger text-center mt-2" th:text="${loginError}"></div>
        </form>
        <div class="text-center mt-3">
            <span>Bạn chưa có tài khoản?</span>
            <a th:href="@{/register}" class="link-primary">Đăng ký ngay</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
