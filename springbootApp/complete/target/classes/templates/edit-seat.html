<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Seat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Edit Seat</h1>
    <form th:action="@{/seats/edit}" th:object="${seat}" method="post" class="mb-3">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3">
            <label class="form-label">Room ID:</label>
            <input type="text" th:field="*{roomId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Seat Number:</label>
            <input type="text" th:field="*{seatNumber}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success">Update</button>
        <a href="/seats" class="btn btn-secondary">Back to Seat List</a>
    </form>
</div>
</body>
</html>
