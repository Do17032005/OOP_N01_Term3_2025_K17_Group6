<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Showtime</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Add Showtime</h1>
    <form th:action="@{/showtimes/add}" th:object="${showtime}" method="post" class="mb-3">
        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Movie ID:</label>
            <input type="text" th:field="*{movieId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Room ID:</label>
            <input type="text" th:field="*{roomId}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Start Time:</label>
            <input type="datetime-local" th:field="*{startTime}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success">Add</button>
        <a href="/showtimes" class="btn btn-secondary">Back to Showtime List</a>
    </form>
</div>
</body>
</html>
