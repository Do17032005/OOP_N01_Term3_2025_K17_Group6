<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đặt vé thành công</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="alert alert-success" role="alert">
        <h2>Đặt vé thành công!</h2>
    </div>
    <h4>Thông tin vé:</h4>
    <ul class="list-group mb-3">
        <li class="list-group-item"><b>Mã vé:</b> <span th:text="${ticket.id}"></span></li>
        <li class="list-group-item"><b>Mã suất chiếu:</b> <span th:text="${ticket.showtimeId}"></span></li>
        <li class="list-group-item"><b>Mã ghế:</b> <span th:text="${ticket.seatId}"></span></li>
        <li class="list-group-item"><b>Mã khách hàng:</b> <span th:text="${ticket.customerId}"></span></li>
        <li class="list-group-item"><b>Giá vé:</b> <span th:text="${ticket.price}"></span> VND</li>
    </ul>
    <a href="/booking/movies" class="btn btn-primary">Đặt vé mới</a>
    <a href="/" class="btn btn-secondary">Trang chủ</a>
</div>
</body>
</html>
