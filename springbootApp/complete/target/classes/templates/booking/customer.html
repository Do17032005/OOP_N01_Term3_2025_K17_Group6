<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thông tin khách hàng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Thông tin khách hàng</h1>
    <form th:action="@{/booking/confirm(showtimeId=${showtimeId},seatId=${seatId})}" th:object="${customer}" method="post" class="mb-3">
        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Name:</label>
            <input type="text" th:field="*{name}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" th:field="*{email}" class="form-control" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone Number:</label>
            <input type="text" th:field="*{phoneNumber}" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-success">Xác nhận đặt vé</button>
        <a th:href="@{'/booking/seats?showtimeId=' + ${showtimeId}}" class="btn btn-secondary">Quay lại chọn ghế</a>
    </form>
</div>
</body>
</html>
