<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Showtime List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div th:if="${message}" class="alert alert-success text-center" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
    <h1 class="mb-4">Showtime List</h1>
    <a href="/showtimes/add" class="btn btn-primary mb-3">Add Showtime</a>
    <table class="table table-bordered table-hover">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Movie ID</th>
            <th>Room ID</th>
            <th>Start Time</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="showtime : ${showtimes}">
            <td th:text="${showtime.id}"></td>
            <td th:text="${showtime.movieId}"></td>
            <td th:text="${showtime.roomId}"></td>
            <td th:text="${showtime.startTime}"></td>
            <td>
                <a th:href="@{'/showtimes/edit/' + ${showtime.id}}" class="btn btn-sm btn-warning">Edit</a>
                <a th:href="@{'/showtimes/delete/' + ${showtime.id}}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this showtime?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
