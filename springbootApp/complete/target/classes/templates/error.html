<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lỗi</title>
    <style>
        :root {
            --main-primary: #0d6efd;
            --primary-bg-subtle: #dbeafe;
            --primary-border-subtle: #69a7fa;
            --primary-text-emphasis: #084298;
        }
        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, "Liberation Sans", sans-serif;
            background: var(--primary-bg-subtle);
            margin: 0;
            padding: 0;
        }
        .container {
            background: #fff;
            max-width: 420px;
            margin: 60px auto;
            padding: 32px 28px 24px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border: 2px solid var(--primary-border-subtle);
            text-align: center;
        }
        h1 {
            color: var(--main-primary);
            font-weight: 700;
            margin-bottom: 18px;
        }
        p {
            color: var(--primary-text-emphasis);
            font-size: 17px;
        }
        a {
            display: inline-block;
            margin-top: 18px;
            padding: 8px 18px;
            background: var(--main-primary);
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid var(--primary-border-subtle);
            transition: background 0.2s, color 0.2s;
        }
        a:hover {
            background: #fff;
            color: var(--main-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Đã xảy ra lỗi!</h1>
        <p th:text="${message}">Có lỗi xảy ra, vui lòng thử lại.</p>
        <a href="/" >Quay về trang chủ</a>
    </div>
</body>
</html>
