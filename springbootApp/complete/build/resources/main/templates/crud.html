<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${title} + ' - Cinema Booking'">CRUD - Cinema Booking</title>
</head>
<body>
    <div th:fragment="content">
        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i th:attr="class=${icon}"></i> <span th:text="${title}">Entity</span></h2>
            <div>
                <a th:href="@{${addUrl}}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Add New
                </a>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{${searchUrl}}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" name="keyword" th:value="${keyword}" class="form-control" 
                               th:placeholder="'Search ' + ${title} + '...'" />
                    </div>
                    <div class="col-md-3" th:if="${filterOptions}">
                        <select name="filter" class="form-select">
                            <option value="">All</option>
                            <option th:each="option : ${filterOptions}" 
                                    th:value="${option.value}" 
                                    th:text="${option.label}"
                                    th:selected="${option.value == selectedFilter}">Filter</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>
                    <div class="col-md-2">
                        <a th:href="@{${listUrl}}" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-arrow-clockwise"></i> Reset
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Data Table -->
        <div class="card">
            <div class="card-body">
                <div th:if="${items}" class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th th:each="column : ${columns}" th:text="${column.label}">Column</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${items}">
                                <td th:each="column : ${columns}" th:with="value=${item[column.field]}">
                                    <!-- Status Badge -->
                                    <span th:if="${column.type == 'status'}" 
                                          class="status-badge"
                                          th:classappend="'status-' + ${#strings.toLowerCase(value)}"
                                          th:text="${value}">Status</span>
                                    
                                    <!-- Date Format -->
                                    <span th:if="${column.type == 'date'}" 
                                          th:text="${#temporals.format(value, 'dd/MM/yyyy HH:mm')}">Date</span>
                                    
                                    <!-- Currency Format -->
                                    <span th:if="${column.type == 'currency'}" 
                                          th:text="${#numbers.formatDecimal(value, 0, 'COMMA', 0, 'POINT')} + ' VND'">Price</span>
                                    
                                    <!-- Default Text -->
                                    <span th:unless="${column.type}" th:text="${value}">Value</span>
                                </td>
                                <td>
                                    <div class="btn-group" role="group">
                                        <a th:href="@{${viewUrl}(id=${item.id})}" class="btn btn-sm btn-outline-primary" 
                                           title="View">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{${editUrl}(id=${item.id})}" class="btn btn-sm btn-outline-warning" 
                                           title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <button type="button" class="btn btn-sm btn-outline-danger" 
                                                th:onclick="'deleteItem(' + ${item.id} + ')'" title="Delete">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Empty State -->
                <div th:unless="${items}" class="text-center text-muted py-5">
                    <i th:attr="class=${icon}" style="font-size: 3rem;"></i>
                    <h5 class="mt-3">No <span th:text="${title}">items</span> found</h5>
                    <p class="text-muted">Start by adding a new <span th:text="${title}">item</span></p>
                    <a th:href="@{${addUrl}}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Add New
                    </a>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
            <nav>
                <ul class="pagination">
                    <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{${listUrl}(page=${currentPage - 1})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${pageNum == currentPage ? 'active' : ''}">
                        <a class="page-link" th:href="@{${listUrl}(page=${pageNum})}" th:text="${pageNum + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                        <a class="page-link" th:href="@{${listUrl}(page=${currentPage + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete this <span th:text="${title}">item</span>?</p>
                    <p class="text-muted">This action cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <form th:action="@{${deleteUrl}}" method="post" style="display: inline;">
                        <input type="hidden" id="deleteId" name="id" />
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function deleteItem(id) {
            document.getElementById('deleteId').value = id;
            new bootstrap.Modal(document.getElementById('deleteModal')).show();
        }
    </script>
</body>
</html>
